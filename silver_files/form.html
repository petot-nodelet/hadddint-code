<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
  <h1>Form Pendaftaran</h1>
  <h2>Masukkan Data Diri Anda dan Pasangan Anda Dengan Benar</h2>
  <form>
    <label for="name">Nama Lengkap anda:</label>
    <input type="text" id="name" name="name" required>
    <br><br>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>
    <br><br>
    <label for="phone">Nomor Telepon:</label>
    <input type="tel" id="phone" name="phone" required>
    <br><br>
    <label for="partner-name">Nama Pasangan:</label>
    <input type="text" id="partner-name" name="partner-name" required>
    <br><br>
    <label for="partner-email">Email Pasangan:</label>
    <input type="email" id="partner-email" name="partner-email" required>
    <br><br>
    <label for="partner-phone">Nomor Telepon Pasangan:</label>
    <input type="tel" id="partner-phone" name="partner-phone" required>
    <br><br>
    <input type="submit" value="Kirim">
  </form>
</body>
</html>
